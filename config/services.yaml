parameters:
    profiles_directory: '%kernel.project_dir%/public/uploads/profiles'
    clubs_photos_directory: '%kernel.project_dir%/public/uploads/clubs'
    GOOGLE_BOOKS_API: '%env(GOOGLE_BOOKS_API)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    App\:
        resource: '../src/'
        exclude: '../src/{DependencyInjection,Entity,Migrations,Tests,Kernel.php}'

    # Injection correcte de la clé API
    App\Controller\BookController:
        arguments:
            $googleBooksApiKey: '%env(resolve:GOOGLE_BOOKS_API)%'

    # Injection de MongoService avec les variables d'environnement
    App\Service\MongoService:
        arguments:
            $mongoUrl: '%env(resolve:MONGODB_URL)%'
            $mongoDb: '%env(resolve:MONGODB_DB)%'

    App\Service\StatsMongoService: ~